{% extends "base.html" %}

{% block title %}報名成功 - 活動報名系統{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-body p-5">
                <div class="mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-check-circle-fill text-success" viewBox="0 0 16 16">
                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                    </svg>
                </div>
                
                <h2 class="fw-bold mb-3">報名成功！</h2>
                <p class="lead text-muted mb-4">
                    您已成功報名 <strong class="text-dark">{{ event.name }}</strong>。
                    <br>感謝您的參與，我們期待在活動中與您相見！
                </p>
                
                <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                    <a href="{{ url_for('event_routes.event_detail', id=event.id) }}" class="btn btn-outline-primary btn-lg px-4 gap-3">
                        返回活動詳情
                    </a>
                    <a href="{{ url_for('event_routes.index') }}" class="btn btn-primary btn-lg px-4">
                        瀏覽其他活動
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
